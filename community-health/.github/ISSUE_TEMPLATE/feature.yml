name: Feature request
description: Propose a user-visible capability or improvement
title: ""
labels: []
type: Feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user or contributor outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Who benefits, and what problem does this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Identify affected components, compatibility constraints, and deliberate non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results that would make the request complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or competing approaches.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for existing issues and project items covering this outcome.
          required: true
