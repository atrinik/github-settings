name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    # The ruleset "03 - Required CI - github-settings" requires this exact job name.
    name: Policy validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository files
        run: python3 .github/scripts/check_repository.py

      - name: Test the settings check (offline fixtures)
        run: python3 -m unittest discover -s tests -v

      - name: Validate Atrinik's baseline file
        run: python3 check_settings.py --validate baselines/atrinik.json
