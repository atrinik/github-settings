name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: Policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate JSON
        run: find config -name '*.json' -print0 | xargs -0 -n1 jq empty

      - name: Check publisher
        run: shellcheck bin/publish
