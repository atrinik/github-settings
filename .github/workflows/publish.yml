name: Publish settings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify settings credential inventory
        env:
          GH_TOKEN: ${{ secrets.ATRINIK_SETTINGS_TOKEN }}
        run: bin/verify-manual-settings

      - name: Apply organization governance and security policy
        env:
          GH_TOKEN: ${{ secrets.ATRINIK_SETTINGS_TOKEN }}
        run: bin/publish --apply
