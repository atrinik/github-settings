name: Publish planning

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-planning
  cancel-in-progress: false

jobs:
  publish:
    name: Publish planning system
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify settings credential inventory
        env:
          GH_TOKEN: ${{ secrets.ATRINIK_SETTINGS_TOKEN }}
        run: bin/verify-manual-settings

      - name: Create issue metadata and shared project
        env:
          GH_TOKEN: ${{ secrets.ATRINIK_SETTINGS_TOKEN }}
        run: bin/publish-planning --apply

      - name: Backfill and synchronize project items
        env:
          GH_TOKEN: ${{ secrets.ATRINIK_SETTINGS_TOKEN }}
        run: bin/sync-project --apply

      - name: Publish organization community health defaults
        env:
          GH_TOKEN: ${{ secrets.ATRINIK_SETTINGS_TOKEN }}
        run: bin/publish-community-health --apply

      - name: Publish repository custom properties
        env:
          GH_TOKEN: ${{ secrets.ATRINIK_SETTINGS_TOKEN }}
        run: bin/publish-repository-properties --apply
